name: Test and release

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to publish"
        required: true
        type: string


permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  release:
    needs: test
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Resolve version from tag
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${DISPATCH_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3. Got: ${TAG}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG}"


      - name: Set CMake project version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("CMakeLists.txt")
          version = os.environ["VERSION"]
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"(project\(\s*kryptic-daemon-client\s+VERSION\s+)\d+\.\d+\.\d+",
              rf"\g<1>{version}",
              text,
              count=1,
              flags=re.IGNORECASE,
          )
          if count != 1:
              raise SystemExit("Expected exactly one project VERSION in CMakeLists.txt")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: python3 .github/scripts/release-notes-from-changelog.py

      - name: GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            gh release edit "$TAG" --title "$(basename "$GITHUB_REPOSITORY") ${VERSION}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --title "$(basename "$GITHUB_REPOSITORY") ${VERSION}" --notes-file "$NOTES_FILE" --verify-tag
          fi
